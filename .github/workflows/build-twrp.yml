name: Build TWRP (Tecno KM5, gatekeeper AIDL fix)

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "make target"
        required: true
        default: "vendorbootimage"
        type: choice
        options:
          - vendorbootimage
          - recoveryimage
          - bootimage

env:
  TWRP_MANIFEST: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  TWRP_BRANCH: twrp-14.1
  DEVICE_PATH: device/tecno/KM5
  LUNCH_COMBO: twrp_KM5-eng

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - name: Checkout this repo (device tree + patch files)
        uses: actions/checkout@v4

      # TWRP source sync + build easily exceeds the ~14GB a stock runner has
      # free. This reclaims space the runner image ships with but that an
      # Android build never touches.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" \
            /usr/local/.ghcup /usr/local/share/boost
          sudo docker image prune --all --force 2>/dev/null || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig python3 python-is-python3 openjdk-17-jdk bc rsync ccache

      - name: Set up repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git identity (required by repo)
        run: |
          git config --global user.name "twrp-ci"
          git config --global user.email "twrp-ci@users.noreply.github.com"
          git config --global color.ui false

      - name: Init TWRP minimal manifest
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p twrp && cd twrp
          repo init -u "$TWRP_MANIFEST" -b "$TWRP_BRANCH" --depth=1

      - name: Sync TWRP source
        working-directory: ${{ runner.temp }}/twrp
        run: |
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags --optimized-fetch
          df -h

      - name: Drop in device tree
        run: |
          mkdir -p "${{ runner.temp }}/twrp/$DEVICE_PATH"
          rsync -a --exclude='.git' "$GITHUB_WORKSPACE/device_tecno_KM5/" "${{ runner.temp }}/twrp/$DEVICE_PATH/"

      # The gatekeeper AIDL fix. See patches/README.txt for what each file
      # changes and why. bootable/recovery/ is common TWRP source synced by
      # the manifest above, not part of the device tree.
      - name: Apply gatekeeper AIDL decrypt patch
        run: |
          set -euo pipefail
          cd "${{ runner.temp }}/twrp"

          # Fail with an actionable message instead of a silent `test -f`.
          require_file() {
            local path="$1"
            if [[ ! -f "$path" ]]; then
              echo "::error::Required file not found: $path"
              echo "Current directory: $PWD"
              echo "Nearby source layout:"
              find bootable -maxdepth 4 -type f \\( -name 'Decrypt.cpp' -o -name 'Android.mk' -o -name 'Android.bp' \\) 2>/dev/null | sort | head -200 || true
              exit 1
            fi
          }

          # Validate all inputs before modifying the synced TWRP source.
          require_file bootable/recovery/crypto/Decrypt.cpp
          require_file bootable/recovery/crypto/Android.mk
          require_file bootable/recovery/prebuilt/Android.mk
          require_file "$GITHUB_WORKSPACE/patches/Decrypt.cpp"
          require_file "$GITHUB_WORKSPACE/patches/crypto_Android.mk"
          require_file "$GITHUB_WORKSPACE/patches/prebuilt_Android.mk"

          cp "$GITHUB_WORKSPACE/patches/Decrypt.cpp"         bootable/recovery/crypto/Decrypt.cpp
          cp "$GITHUB_WORKSPACE/patches/crypto_Android.mk"   bootable/recovery/crypto/Android.mk
          cp "$GITHUB_WORKSPACE/patches/prebuilt_Android.mk" bootable/recovery/prebuilt/Android.mk

          echo "Patched files in place:"
          ls -la bootable/recovery/crypto/Decrypt.cpp bootable/recovery/crypto/Android.mk bootable/recovery/prebuilt/Android.mk

      - name: Build
        working-directory: ${{ runner.temp }}/twrp
        run: |
          set -e
          export USE_CCACHE=1
          export CCACHE_DIR="${{ runner.temp }}/ccache"
          source build/envsetup.sh
          lunch "$LUNCH_COMBO"
          mka "${{ github.event.inputs.build_target || 'vendorbootimage' }}" -j"$(nproc)"

      - name: Collect output images
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out_images"
          find "${{ runner.temp }}/twrp/out/target/product" -maxdepth 1 -type d -name '*' \
            -exec sh -c 'cp -v "$1"/*.img "$GITHUB_WORKSPACE/out_images/" 2>/dev/null || true' _ {} \;
          ls -la "$GITHUB_WORKSPACE/out_images" || echo "no images found -- check the build log above"

      - name: Upload built image(s)
        uses: actions/upload-artifact@v4
        with:
          name: twrp-KM5-gatekeeper-fix
          path: out_images/*.img
          if-no-files-found: error
          retention-days: 14
